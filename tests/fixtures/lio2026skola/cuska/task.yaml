name: 'cuska'
title: 'Purva čūska'
statements:
  - ['./teksts/cuska.typ', 'lv']

time_limit: 0.5
memory_limit: 256

validator: './riki/validator.cpp'
tests_archive: './testi/tests.zip'

# == Nepieciešams ne komunikāciju uzdevumos, 
# kur žūrijas atbilde var nesakrist ar dalībnieka atbildi
