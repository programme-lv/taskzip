[package]
name = "taskzip"
version = "0.1.0"
edition = "2021"

[lib]
name = "taskzip"
path = "src/lib.rs"

[[bin]]
name = "taskzip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6.8"
dialoguer = "0.12.0"
dotenvy = "0.15.7"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
wait-timeout = "0.2"
walkdir = "2"
zip = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
